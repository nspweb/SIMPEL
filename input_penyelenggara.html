<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Penyelenggara - SIMPEL BPVP Kendari 2026</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="simpel_auth.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-heading { font-family: 'Space Grotesk', sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-slate-50 flex flex-col">

    <!-- UNIFIED HEADER -->
    <div id="simpel-unified-header"></div>

    <!-- MAIN CONTENT -->
    <main class="flex-1 max-w-4xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
        
        <!-- BREADCRUMB -->
        <div class="flex items-center justify-between">
            <a href="input.html" class="inline-flex items-center gap-1.5 text-xs font-bold text-slate-600 hover:text-teal-600 transition">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Kembali ke Pusat Input</span>
            </a>
            <span class="px-3 py-1 rounded-full bg-teal-50 text-teal-700 text-xs font-bold">
                Tahap 1: Pembukaan Kelas & Program
            </span>
        </div>

        <!-- FORM CARD -->
        <div class="bg-white rounded-3xl border border-slate-200 shadow-xs overflow-hidden">
            
            <div class="p-6 bg-gradient-to-r from-slate-900 to-[#2C4C63] text-white flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center text-teal-300 text-lg border border-white/20">
                        <i class="fa-solid fa-chalkboard-user"></i>
                    </div>
                    <div>
                        <h2 class="text-lg font-bold font-heading">Formulir Input Penyelenggara Pelatihan</h2>
                        <p class="text-xs text-slate-200">Buat paket program pelatihan kerja baru TA 2026</p>
                    </div>
                </div>
                <a href="pelatihan.html" class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-white text-xs font-medium border border-white/20 transition">
                    <i class="fa-solid fa-table-list"></i>
                    <span>Data Pelatihan</span>
                </a>
            </div>

            <form onsubmit="handleSave(event)" class="p-6 sm:p-8 space-y-6 text-xs">
                
                <!-- SECTION 1: PROGRAM -->
                <div class="space-y-4">
                    <div class="flex items-center gap-2 pb-2 border-b border-slate-100">
                        <span class="w-6 h-6 rounded-full bg-teal-100 text-teal-800 text-xs font-bold flex items-center justify-center">1</span>
                        <h3 class="text-sm font-bold text-slate-800 uppercase tracking-wide">Identitas Program & Kejuruan</h3>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1.5">Kejuruan Pelatihan <span class="text-red-500">*</span></label>
                            <select id="kejuruan" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-teal-500 focus:outline-none bg-slate-50/50">
                                <option value="">-- Pilih Kejuruan --</option>
                                <option value="Teknologi Informasi dan Komunikasi (TIK)">Teknologi Informasi dan Komunikasi (TIK)</option>
                                <option value="Teknik Manufaktur dan Rekayasa (Las)">Teknik Manufaktur dan Rekayasa (Las)</option>
                                <option value="Teknik Otomotif">Teknik Otomotif</option>
                                <option value="Teknik Ketenagalistrikan">Teknik Ketenagalistrikan</option>
                                <option value="Pariwisata & Perhotelan">Pariwisata & Perhotelan</option>
                                <option value="Garmen Apparel">Garmen Apparel</option>
                                <option value="Bisnis dan Manajemen">Bisnis dan Manajemen</option>
                                <option value="Teknik Bangunan & Konstruksi">Teknik Bangunan & Konstruksi</option>
                            </select>
                        </div>

                        <div>
                            <label class="block font-semibold text-slate-700 mb-1.5">Jenis Skema Program <span class="text-red-500">*</span></label>
                            <select id="jenis_pelatihan" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-teal-500 focus:outline-none bg-slate-50/50">
                                <option value="PBK Reguler">PBK Reguler (Pelatihan Berbasis Kompetensi)</option>
                                <option value="TMT (Tailor Made Training)">TMT (Tailor Made Training - Permintaan Industri/DUDI)</option>
                                <option value="PBL (Pelatihan Berbasis Luar/Komunitas)">PBL (Pelatihan Berbasis Lapangan / Luar / Proyek)</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block font-semibold text-slate-700 mb-1.5">Nama Program Pelatihan & Nomor Batch <span class="text-red-500">*</span></label>
                        <input type="text" id="program_pelatihan" required placeholder="Contoh: Junior Web Developer - Batch 2" 
                               class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-teal-500 focus:outline-none bg-slate-50/50">
                    </div>
                </div>

                <!-- SECTION 2: JADWAL & KUOTA -->
                <div class="space-y-4 pt-4">
                    <div class="flex items-center gap-2 pb-2 border-b border-slate-100">
                        <span class="w-6 h-6 rounded-full bg-teal-100 text-teal-800 text-xs font-bold flex items-center justify-center">2</span>
                        <h3 class="text-sm font-bold text-slate-800 uppercase tracking-wide">Target Kuota & Jadwal</h3>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1.5">Target Kuota Peserta</label>
                            <input type="number" id="target_peserta" value="16" min="1" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-teal-500 bg-slate-50/50">
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1.5">Tanggal Mulai Pelatihan</label>
                            <input type="date" id="tgl_mulai" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-teal-500 bg-slate-50/50">
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1.5">Tanggal Selesai Pelatihan</label>
                            <input type="date" id="tgl_selesai" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-teal-500 bg-slate-50/50">
                        </div>
                    </div>

                    <div>
                        <label class="block font-semibold text-slate-700 mb-1.5">Catatan / Keterangan Khusus</label>
                        <textarea id="keterangan" rows="2" placeholder="Catatan instruktur, tempat workshop..." 
                                  class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-teal-500 bg-slate-50/50"></textarea>
                    </div>
                </div>

                <!-- CLEAN ACTION BAR -->
                <div class="pt-6 border-t border-slate-200 flex items-center justify-between">
                    <button type="reset" class="px-4 py-2.5 rounded-xl font-semibold text-slate-600 hover:text-slate-800 hover:bg-slate-100 transition">
                        <i class="fa-solid fa-rotate-left mr-1.5"></i> Reset
                    </button>
                    <div class="flex items-center gap-3">
                        <a href="pelatihan.html" class="px-5 py-2.5 rounded-xl font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 transition">
                            Batal
                        </a>
                        <button type="submit" class="inline-flex items-center gap-2 px-6 py-2.5 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-bold shadow-md hover:shadow-lg transition">
                            <i class="fa-solid fa-circle-check"></i>
                            <span>Simpan Program Pelatihan</span>
                        </button>
                    </div>
                </div>

            </form>

        </div>

    </main>

    <!-- FOOTER -->
    <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500">
        &copy; 2026 SIMPEL BPVP Kendari &bull; Penyelenggara Pelatihan
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            SimpelAuth.renderNavbar('input_penyelenggara');
        });

        function handleSave(e) {
            e.preventDefault();
            Swal.fire({
                icon: 'success',
                title: 'Program Berhasil Disimpan!',
                text: 'Paket pelatihan ' + document.getElementById('program_pelatihan').value + ' telah ditambahkan.',
                confirmButtonColor: '#0d9488'
            }).then(() => {
                window.location.href = 'pelatihan.html';
            });
        }
    </script>
</body>
</html>
